version: '3.9'

networks:
  traefik-net:
    external: true   # created by infra/scripts/setup.sh
  internal:
    driver: bridge

volumes:
  postgres_data:
  builds_data:
  logs_data:
  registry_data:
  letsencrypt:

# ─────────────────────────────────────────────────────────────────────────────
# TRAEFIK — Reverse proxy + SSL
# ─────────────────────────────────────────────────────────────────────────────
services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik-net
    labels:
      - traefik.enable=true
      # Dashboard (basic auth protected)
      - traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=traefik-auth
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
      # HTTP → HTTPS redirect
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)
      - traefik.http.routers.http-catchall.entrypoints=web
      - traefik.http.routers.http-catchall.middlewares=https-redirect

  # ─────────────────────────────────────────────────────────────────────────
  # POSTGRES
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: vpslatam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpslatam
      POSTGRES_USER: ${POSTGRES_USER:-vpslatam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpslatam}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  # LOCAL DOCKER REGISTRY (optional — for image caching)
  # ─────────────────────────────────────────────────────────────────────────
  registry:
    image: registry:2
    container_name: vpslatam-registry
    restart: unless-stopped
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - internal
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

  # ─────────────────────────────────────────────────────────────────────────
  # API — Fastify backend
  # ─────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vpslatam-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpslatam}:${POSTGRES_PASSWORD}@postgres:5432/vpslatam
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      FRONTEND_URL: https://${BASE_DOMAIN}
      API_URL: https://api.${BASE_DOMAIN}
      BASE_DOMAIN: ${BASE_DOMAIN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DOCKER_SOCKET: /var/run/docker.sock
      REGISTRY_URL: registry:5000
      BUILDS_DIR: /var/vpslatam/builds
      LOGS_DIR: /var/vpslatam/logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - builds_data:/var/vpslatam/builds
      - logs_data:/var/vpslatam/logs
    networks:
      - internal
      - traefik-net
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${BASE_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=4000
    deploy:
      resources:
        limits:
          memory: 512m

  # ─────────────────────────────────────────────────────────────────────────
  # WEB — Vite React SPA (served by nginx)
  # ─────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: https://api.${BASE_DOMAIN}/api
    container_name: vpslatam-web
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${BASE_DOMAIN}`) || Host(`www.${BASE_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=80
    deploy:
      resources:
        limits:
          memory: 64m
